# Connector name in Kafka Connect
name=elasticsearch-sink

# Kafka topic to be consumed by Elasticsearch
topics=postgres-server.public.usuarios
# The connector listens to messages from the "usuarios" topic, which contains data replicated from PostgreSQL.

# Connector class responsible for sending data to Elasticsearch
connector.class=io.confluent.connect.elasticsearch.ElasticsearchSinkConnector

# Elasticsearch server URL
connection.url=http://es01:9200
# The connector will send data to the "es01" node on port 9200.

# Document type in Elasticsearch
type.name=_doc
# Defines the document type to be stored. In Elasticsearch 7+, "_doc" is the default value.

# JSON value converter configuration
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
# Specifies that values will be converted to JSON without including an Avro schema.

# Ignore the Kafka Connect schema
schema.ignore=true
# This setting prevents the connector from enforcing a schema on the data before sending it to Elasticsearch.

# Ignore the Kafka event key
key.ignore=true
# Indicates that Elasticsearch will not store the record key, only the value data.
# Connector name in Kafka Connect
name=postgres-connector

# Debezium connector class for PostgreSQL
connector.class=io.debezium.connector.postgresql.PostgresConnector

# Maximum number of tasks the connector can run simultaneously
tasks.max=1
# Since we are monitoring a single database, only one task is sufficient.

# PostgreSQL database access credentials
database.user=root
database.password=root

# Name of the database to be monitored
database.dbname=usuarios

# Logical name of the PostgreSQL server in Kafka
database.server.name=postgres-server
# This name will be used as a prefix for Kafka topics where change events will be published.

# PostgreSQL connection configuration
database.hostname=postgres
database.port=5432
# The connector connects to the database running in the "postgres" service on port 5432.

# Kafka storage configuration for the change history
database.history.kafka.bootstrap.servers=kafka:9092
database.history.kafka.topic=history
# The database schema change history will be stored in the "history" topic in Kafka.

# Logical replication plugin used by PostgreSQL
plugin.name=pgoutput
# "pgoutput" is the recommended plugin for PostgreSQL 10+ and is required to capture database changes.